<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISHA | VICE SPORTS CAPTAIN 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #FFFDF5;
            --beige: #F7E7CE;
            --brown: #74512D;
            --clay: #AF8260;
            --accent: #E29578;
        }
        body { 
            font-family: 'Space Grotesk', sans-serif; 
            background-color: var(--cream);
            color: var(--brown);
            overflow-x: hidden;
        }
        h1, h2, h3 { font-family: 'Outfit', sans-serif; text-transform: uppercase; }

        .floating-icon {
            position: absolute;
            font-size: 3.5rem;
            pointer-events: none;
            z-index: 1;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.1));
            animation: float-around 12s infinite ease-in-out;
        }
        @keyframes float-around {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(40px, -60px) rotate(15deg); }
            66% { transform: translate(-30px, 30px) rotate(-15deg); }
        }

        .marquee {
            white-space: nowrap;
            overflow: hidden;
            background: var(--brown);
            color: var(--cream);
            padding: 20px 0;
            font-family: 'Outfit';
            font-weight: 900;
            font-size: 1.8rem;
            transform: rotate(-1deg);
            width: 110%;
            margin-left: -5%;
        }
        .marquee-content {
            display: inline-block;
            animation: marquee 25s linear infinite;
        }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        .bento-card {
            background: white;
            border: 5px solid var(--brown);
            box-shadow: 12px 12px 0px var(--brown);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 24px;
        }
        
        /* Fixed Logo Container to ensure it fits */
        .logo-container {
            background: white;
            border: 6px solid var(--brown);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .cta-button {
            background: var(--accent);
            border: 4px solid var(--brown);
            box-shadow: 6px 6px 0px var(--brown);
            transition: 0.2s;
        }
    </style>
</head>
<body>

    <nav class="fixed top-0 w-full z-50 bg-white border-b-4 border-brown px-6 py-3 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-14 h-14 rounded-xl logo-container bg-beige">
                <img src="image_df3a17.jpg" alt="Logo" class="w-full h-full object-contain p-1">
            </div>
            <div class="text-xl font-black italic tracking-tighter">ISHA MEHANNA</div>
        </div>
        <a href="#vote" class="cta-button px-6 py-2 rounded-xl text-white font-bold text-sm">VOTE NOW</a>
    </nav>

    <section class="min-h-screen flex flex-col items-center justify-center px-6 text-center relative pt-24">
        <div class="w-40 h-40 md:w-56 md:h-56 rounded-full logo-container bento-card mb-8">
            <img src="image_df3a17.jpg" alt="Campaign Logo" class="w-full h-full object-contain p-4">
        </div>

        <div class="inline-block px-6 py-2 bg-white border-4 border-brown rounded-2xl mb-6 font-black text-sm uppercase tracking-widest">
            Al Yasmin International School • 2026
        </div>
        
        <h1 class="text-5xl md:text-9xl font-black leading-tight mb-4">
            THE FORCE <br> <span class="text-white" style="-webkit-text-stroke: 3px var(--brown)">OF 9A.</span>
        </h1>

        <h2 class="text-2xl md:text-4xl font-black text-[#E29578] mb-10 tracking-widest">
            VICE SPORTS CAPTAIN
        </h2>

        <div class="flex flex-col md:flex-row items-center gap-8 mb-12">
            <div class="relative">
                <div class="w-64 h-64 md:w-80 md:h-80 rounded-[3rem] border-4 border-brown bg-white overflow-hidden shadow-[12px_12px_0px_#74512D]">
                    <img src="image_d46ef7.jpg" alt="Isha Profile" class="w-full h-full object-cover">
                </div>
                <div class="absolute -bottom-4 -right-4 bg-white border-4 border-brown px-4 py-2 rounded-xl font-black text-xl rotate-12 shadow-lg">CLASS 9A</div>
            </div>

            <div class="max-w-sm text-left">
                <p class="text-xl font-bold leading-tight">
                    "I believe I am confident and very capable of leading this position. Let's make sports at Al Yasmin better for everyone."
